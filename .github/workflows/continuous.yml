name: Build

on:
  push:
    branches: [v2]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - continuous

permissions:
  contents: read

env:
  EUPROVGUARD_VERSION: "v1.2.1"

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.value }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go test -race ./...
          go vet ./...
          go run . gen-schema --output /tmp/manifest-v2.json
          diff -u schema/manifest-v2.json /tmp/manifest-v2.json

      - id: version
        name: Resolve version
        run: |
          version="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            version="0.0.0-$(git rev-parse --short HEAD)"
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X main.version=${VERSION} -X main.selfUpdateMode=enabled -X github.com/mirkobrombin/cpak/pkg/desktopui.defaultBackend=auto" -o "dist/cpak-linux-${arch}" .
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/cpak-storaged-linux-${arch}" github.com/fvs-lab/fvs2d/cmd/fvs2d
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X github.com/mirkobrombin/cpak/pkg/desktopui.defaultBackend=auto" -o "/tmp/cpak-installer-linux-${arch}" ./cmd/cpak-installer
            go run ./cmd/cpak-pack \
              --installer "/tmp/cpak-installer-linux-${arch}" \
              --cpak "dist/cpak-linux-${arch}" \
              --storaged "dist/cpak-storaged-linux-${arch}" \
              --output "dist/cpak-installer-linux-${arch}"
          done
          cd dist
          sha256sum cpak-linux-* cpak-storaged-linux-* cpak-installer-linux-* > SHA256SUMS

      - name: Build signed installer catalog
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CPAK_INSTALLER_PRIVATE_KEY: ${{ secrets.CPAK_INSTALLER_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          go run ./cmd/cpak-catalog \
            --release "${{ steps.version.outputs.value }}" \
            --installer-dir dist \
            --output dist/cpak-installer-catalog.json
          cd dist
          sha256sum cpak-installer-catalog.json >> SHA256SUMS

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: dist
          format: spdx-json
          output-file: dist/cpak.spdx.json
          upload-artifact: false

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpak-${{ steps.version.outputs.value }}
          path: dist
          if-no-files-found: error

  compliance:
    name: Compliance
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod
          cache: false

      - name: Install EUProvGuard
        run: go install github.com/fabricatorsltd/euprovguard@${{ env.EUPROVGUARD_VERSION }}

      - name: Scan Cpak
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compliance
          euprovguard \
            -path . \
            -name cpak \
            -version-tag "${{ needs.build.outputs.version }}" \
            -output compliance/sbom-cpak.json \
            -bundle compliance/report-cpak 2>&1 | tee compliance/scan-cpak.log

      - name: Fail on compliance findings
        shell: bash
        run: |
          set -euo pipefail
          sbom="compliance/sbom-cpak.json"
          log="compliance/scan-cpak.log"

          recorded=$(jq '(.vulnerabilities // []) | length' "${sbom}")
          cves=$(sed -n 's/.*CVE findings: \([0-9][0-9]*\).*/\1/p' "${log}" | tail -n 1)
          sast=$(sed -n 's/.*Native SAST completed: found \([0-9][0-9]*\) issues.*/\1/p' "${log}" | tail -n 1)

          echo "cpak: sbom=${recorded} cve=${cves:-missing} sast=${sast:-missing}"

          if [ -z "${cves}" ] || [ -z "${sast}" ]; then
            echo "::error::cpak: EUProvGuard summary could not be parsed"
            exit 1
          fi
          if grep -q "OSV/EUVD query failed" "${log}"; then
            echo "::error::cpak: vulnerability databases were unreachable"
            exit 1
          fi
          if [ "${recorded}" -gt 0 ] || [ "${cves}" -gt 0 ] || [ "${sast}" -gt 0 ]; then
            echo "::error::cpak: EUProvGuard reported findings"
            exit 1
          fi

      - name: Upload compliance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: compliance-reports
          path: compliance/
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build, compliance]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cpak-${{ needs.build.outputs.version }}
          path: dist

      - name: Attest binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            dist/cpak-linux-*
            dist/cpak-storaged-linux-*
            dist/cpak-installer-linux-*

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            dist/cpak-linux-*
            dist/cpak-storaged-linux-*
            dist/cpak-installer-linux-*
          sbom-path: dist/cpak.spdx.json

      - name: Move channel tag
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/v2'))
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          channel="${CHANNEL}"
          if [[ -z "${channel}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
              channel="nightly"
            else
              channel="continuous"
            fi
          fi
          gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${channel}" \
            -f sha="${GITHUB_SHA}" \
            -F force=true

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*

      - name: Publish nightly
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'nightly')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          name: Nightly Build
          files: dist/*

      - name: Publish continuous
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/v2')) || (github.event_name == 'workflow_dispatch' && inputs.channel == 'continuous')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          tag_name: continuous
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          name: Continuous Build
          files: dist/*

      - name: Remove stale channel assets
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/v2'))
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          channel="${CHANNEL}"
          if [[ -z "${channel}" ]]; then
            if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
              channel="nightly"
            else
              channel="continuous"
            fi
          fi
          while IFS=$'\t' read -r asset_id asset_name; do
            keep=false
            for path in dist/*; do
              if [[ "$(basename "${path}")" == "${asset_name}" ]]; then
                keep=true
                break
              fi
            done
            if [[ "${keep}" == false ]]; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            fi
          done < <(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${channel}" --jq '.assets[] | [.id, .name] | @tsv')
