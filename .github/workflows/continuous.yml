name: Build

on:
  push:
    branches: ["v2"]
    tags: ["v*"]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        default: "nightly"
        type: choice
        options:
          - nightly
          - continuous

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      
      - name: Set up Musl
        run: |
          sudo apt-get update
          sudo apt-get install -y musl musl-tools

      - name: Build
        run: make all

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag_name: "${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            cpak

      - name: Publish nightly
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'nightly')
        uses: softprops/action-gh-release@v2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag_name: "nightly"
          target_commitish: "v2"
          prerelease: true
          name: "Nightly Build"
          files: |
            cpak

      - name: Publish continuous
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/v2') || (github.event_name == 'workflow_dispatch' && inputs.channel == 'continuous')
        uses: softprops/action-gh-release@v2
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          tag_name: "continuous"
          target_commitish: "v2"
          prerelease: true
          name: "Continuous Build"
          files: |
            cpak

      - uses: actions/upload-artifact@v4
        with:
          name: cpak
          path: |
            cpak
