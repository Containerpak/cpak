name: Portability

on:
  schedule:
    - cron: "43 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o cpak-linux-amd64 .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cpak-portability
          path: cpak-linux-amd64
          if-no-files-found: error

  userspace:
    needs: binary
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - debian:13
          - fedora:42
          - archlinux:latest
          - opensuse/tumbleweed:latest
          - ubuntu:26.04
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: cpak-portability
      - run: |
          chmod 0755 cpak-linux-amd64
          ./cpak-linux-amd64 --version
          ./cpak-linux-amd64 gen-schema
          test -s manifest.schema.json

  kernel:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod
      - run: |
          go test ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath -o cpak .
          set +e
          ./cpak doctor --json > doctor.json
          doctor_status=$?
          set -e
          DOCTOR_STATUS="$doctor_status" python3 - <<'PY'
          import json
          import os

          with open("doctor.json", encoding="utf-8") as report_file:
              report = json.load(report_file)

          checks = report.get("checks", [])
          names = {check.get("name") for check in checks}
          required_names = {
              "Linux",
              "unprivileged user namespaces",
              "rootless OverlayFS",
              "mount_setattr",
              "seccomp",
              "Landlock",
              "cgroup v2 delegation",
              "host init",
              "desktop display",
              "desktop audio",
              "host command bridge",
          }
          missing = required_names - names
          if missing:
              raise SystemExit(f"doctor report is missing checks: {sorted(missing)}")

          ready = bool(report.get("ready"))
          required_ready = all(
              bool(check.get("available"))
              for check in checks
              if check.get("required")
          )
          status = int(os.environ["DOCTOR_STATUS"])
          if ready != required_ready:
              raise SystemExit("doctor readiness does not match its required checks")
          if (status == 0) != ready:
              raise SystemExit("doctor exit status does not match its readiness report")
          PY
